<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisitPro - 智能 CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Primary Colors - Modern Blue */
        --primary-50: #eff6ff;
        --primary-100: #dbeafe;
        --primary-200: #bfdbfe;
        --primary-300: #93c5fd;
        --primary-400: #60a5fa;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
        --primary-800: #1e40af;
        --primary-900: #1e3a8a;
        --primary-950: #172554;
        
        /* Semantic Colors */
        --success: #10b981;
        --success-light: #d1fae5;
        --warning: #f59e0b;
        --warning-light: #fef3c7;
        --danger: #ef4444;
        --danger-light: #fee2e2;
        --info: #8b5cf6;
        --info-light: #ede9fe;
        
        /* Neutral Colors */
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --border: #e2e8f0;
        --border-light: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-tertiary: #94a3b8;
        
        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        
        /* Radius */
        --radius-sm: 6px;
        --radius: 10px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 20px;
        --radius-full: 9999px;
        
        /* Transitions */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      * {
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Animation Keyframes */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeInUp {
        from { 
          opacity: 0; 
          transform: translateY(10px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }
      
      @keyframes fadeInDown {
        from { 
          opacity: 0; 
          transform: translateY(-10px); 
        }
        to { 
          opacity: 1; 
          transform: translateY(0); 
        }
      }
      
      @keyframes scaleIn {
        from { 
          opacity: 0; 
          transform: scale(0.95); 
        }
        to { 
          opacity: 1; 
          transform: scale(1); 
        }
      }
      
      @keyframes slideInRight {
        from { 
          opacity: 0; 
          transform: translateX(20px); 
        }
        to { 
          opacity: 1; 
          transform: translateX(0); 
        }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-25%); }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }
      
      /* Animation Classes */
      .animate-fade-in {
        animation: fadeIn var(--transition) forwards;
      }
      
      .animate-fade-in-up {
        animation: fadeInUp var(--transition-slow) forwards;
      }
      
      .animate-fade-in-down {
        animation: fadeInDown var(--transition) forwards;
      }
      
      .animate-scale-in {
        animation: scaleIn var(--transition) forwards;
      }
      
      .animate-slide-in-right {
        animation: slideInRight var(--transition) forwards;
      }
      
      .animate-pulse-slow {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      .animate-bounce-slow {
        animation: bounce 2s infinite;
      }
      
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      
      /* Glass Effect */
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      .glass-dark {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      
      /* Card Styles */
      .card {
        background: var(--bg-primary);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-light);
        transition: box-shadow var(--transition), transform var(--transition);
      }
      
      .card:hover {
        box-shadow: var(--shadow-md);
      }
      
      .card-interactive {
        cursor: pointer;
      }
      
      .card-interactive:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
      }
      
      /* Button Styles */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        border-radius: var(--radius);
        transition: all var(--transition-fast);
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }
      
      .btn-primary {
        background: var(--primary-600);
        color: white;
        box-shadow: 0 1px 2px 0 rgb(37 99 235 / 0.2);
      }
      
      .btn-primary:hover {
        background: var(--primary-700);
        box-shadow: 0 4px 6px -1px rgb(37 99 235 / 0.3);
        transform: translateY(-1px);
      }
      
      .btn-secondary {
        background: var(--bg-tertiary);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      
      .btn-secondary:hover {
        background: var(--bg-secondary);
        border-color: var(--primary-300);
        color: var(--primary-700);
      }
      
      .btn-ghost {
        background: transparent;
        color: var(--text-secondary);
      }
      
      .btn-ghost:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      
      .btn-danger {
        background: var(--danger-light);
        color: var(--danger);
      }
      
      .btn-danger:hover {
        background: var(--danger);
        color: white;
      }
      
      /* Input Styles */
      .input {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-primary);
        color: var(--text-primary);
        transition: all var(--transition-fast);
      }
      
      .input:focus {
        outline: none;
        border-color: var(--primary-500);
        box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1);
      }
      
      .input::placeholder {
        color: var(--text-tertiary);
      }
      
      /* Badge Styles */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 500;
        border-radius: var(--radius-full);
      }
      
      .badge-success {
        background: var(--success-light);
        color: #065f46;
      }
      
      .badge-warning {
        background: var(--warning-light);
        color: #92400e;
      }
      
      .badge-danger {
        background: var(--danger-light);
        color: #991b1b;
      }
      
      .badge-info {
        background: var(--info-light);
        color: #5b21b6;
      }
      
      /* Status Indicator */
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      
      .status-dot-success { background: var(--success); }
      .status-dot-warning { background: var(--warning); }
      .status-dot-danger { background: var(--danger); }
      .status-dot-info { background: var(--info); }
      
      /* Gradient Backgrounds */
      .gradient-primary {
        background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-800) 100%);
      }
      
      .gradient-success {
        background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
      }
      
      .gradient-warning {
        background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
      }
      
      .gradient-danger {
        background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
      }
      
      /* Skeleton Loading */
      .skeleton {
        background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-secondary) 50%, var(--bg-tertiary) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: var(--radius);
      }
      
      /* Focus Ring */
      .focus-ring:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgb(59 130 246 / 0.15);
      }
      
      /* Table Styles */
      .table-container {
        overflow-x: auto;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-light);
      }
      
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      
      .table th {
        background: var(--bg-tertiary);
        padding: 12px 16px;
        text-align: left;
        font-weight: 600;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border);
      }
      
      .table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-light);
        color: var(--text-primary);
      }
      
      .table tr:last-child td {
        border-bottom: none;
      }
      
      .table tr:hover td {
        background: var(--bg-secondary);
      }
      
      /* Sidebar Styles */
      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius);
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 500;
        transition: all var(--transition-fast);
        margin-bottom: 4px;
      }
      
      .sidebar-link:hover {
        background: var(--bg-tertiary);
        color: var(--text-primary);
      }
      
      .sidebar-link.active {
        background: var(--primary-50);
        color: var(--primary-700);
      }
      
      .sidebar-link.active svg {
        color: var(--primary-600);
      }
      
      /* Tab Styles */
      .tab {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        border-bottom: 2px solid transparent;
        transition: all var(--transition-fast);
        cursor: pointer;
        white-space: nowrap;
      }
      
      .tab:hover {
        color: var(--text-primary);
      }
      
      .tab.active {
        color: var(--primary-600);
        border-bottom-color: var(--primary-600);
      }
      
      /* Divider */
      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
        margin: 24px 0;
      }
      
      /* Tooltip */
      .tooltip {
        position: relative;
      }
      
      .tooltip::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(-8px);
        padding: 6px 12px;
        background: var(--text-primary);
        color: white;
        font-size: 12px;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: all var(--transition-fast);
        z-index: 50;
      }
      
      .tooltip:hover::after {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(-4px);
      }
      
      /* Markdown Content Styles */
      .markdown-content {
        font-size: 14px;
        line-height: 1.8;
        color: var(--text-primary);
      }
      
      .markdown-content .markdown-h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 16px 0 12px 0;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--primary-200);
      }
      
      .markdown-content .markdown-h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 14px 0 10px 0;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--primary-100);
      }
      
      .markdown-content .markdown-h3 {
        font-size: 16px;
        font-weight: 600;
        color: var(--primary-700);
        margin: 12px 0 8px 0;
      }
      
      .markdown-content .markdown-paragraph {
        margin: 8px 0;
        color: var(--text-secondary);
      }
      
      .markdown-content .markdown-list {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .markdown-content .markdown-list-item {
        margin: 4px 0;
        color: var(--text-secondary);
      }
      
      .markdown-content ul.markdown-list {
        list-style-type: disc;
      }
      
      .markdown-content ol.markdown-list {
        list-style-type: decimal;
      }
      
      .markdown-content strong {
        font-weight: 600;
        color: var(--text-primary);
      }
      
      .markdown-content em {
        font-style: italic;
        color: var(--text-secondary);
      }
      
      .markdown-content .markdown-code-inline {
        background: var(--bg-tertiary);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        font-size: 12px;
        color: var(--primary-700);
      }
      
      .markdown-content .markdown-link {
        color: var(--primary-600);
        text-decoration: none;
        border-bottom: 1px solid var(--primary-300);
        transition: all var(--transition-fast);
      }
      
      .markdown-content .markdown-link:hover {
        color: var(--primary-700);
        border-bottom-color: var(--primary-600);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: 'var(--primary-50)',
                100: 'var(--primary-100)',
                200: 'var(--primary-200)',
                300: 'var(--primary-300)',
                400: 'var(--primary-400)',
                500: 'var(--primary-500)',
                600: 'var(--primary-600)',
                700: 'var(--primary-700)',
                800: 'var(--primary-800)',
                900: 'var(--primary-900)',
                950: 'var(--primary-950)',
              }
            }
          }
        }
      }
    </script>
